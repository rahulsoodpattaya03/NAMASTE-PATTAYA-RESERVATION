<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattaya Namaste — Layout Concept (Men & Women themes)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Poppins', sans-serif; }
.serif { font-family: 'Playfair Display', serif; }

/* ===== WOMEN THEME (default) ===== */
:root {
  --scene: linear-gradient(160deg,#a78bfa 0%,#c4b5fd 25%,#f0abfc 60%,#fbcfe8 100%);
  --hero-overlay: linear-gradient(180deg, rgba(167,139,250,0.05) 0%, rgba(236,72,153,0.15) 60%, rgba(255,255,255,0.92) 100%);
  --hero-img: url('https://images.unsplash.com/photo-1552465011-b4e21bf6e79a?auto=format&fit=crop&w=1200&q=80');
  --title: #581c87;
  --subtitle: rgba(88,28,135,0.8);
  --card-bg: #ffffff;
  --accentA: #e879f9; --accentB: #ec4899;      /* pink/fuchsia */
  --btn: linear-gradient(90deg,#7c3aed,#d946ef);
  --nav: linear-gradient(90deg,#7c3aed,#9333ea);
  --shadow: rgba(124,58,237,0.35);
  --t1a:#e879f9; --t1b:#a855f7;
  --t2a:#fbbf24; --t2b:#f97316;
  --t3a:#38bdf8; --t3b:#3b82f6;
  --t4a:#34d399; --t4b:#14b8a6;
  --t5a:#fb7185; --t5b:#ec4899;
  --t6a:#818cf8; --t6b:#8b5cf6;
}
/* ===== MEN THEME ===== */
body.men {
  --scene: linear-gradient(160deg,#0f172a 0%,#1e293b 40%,#0b3a53 75%,#134e4a 100%);
  --hero-overlay: linear-gradient(180deg, rgba(2,6,23,0.15) 0%, rgba(2,6,23,0.45) 55%, rgba(15,23,42,0.96) 100%);
  --hero-img: url('https://images.unsplash.com/photo-1508009603885-50cf7c579365?auto=format&fit=crop&w=1200&q=80');
  --title: #e2e8f0;
  --subtitle: rgba(226,232,240,0.75);
  --card-bg: #111827;
  --accentA: #0ea5e9; --accentB: #0891b2;      /* steel/cyan */
  --btn: linear-gradient(90deg,#0e7490,#0284c7);
  --nav: linear-gradient(90deg,#0f172a,#155e75);
  --shadow: rgba(2,6,23,0.6);
  --t1a:#0ea5e9; --t1b:#0369a1;   /* clubs/beaches */
  --t2a:#f59e0b; --t2b:#b45309;   /* nightlife - bronze */
  --t3a:#14b8a6; --t3b:#0f766e;   /* tours - teal */
  --t4a:#64748b; --t4b:#334155;   /* spa - steel */
  --t5a:#ef4444; --t5b:#991b1b;   /* dining - deep red */
  --t6a:#6366f1; --t6b:#3730a3;   /* hotels - indigo */
}
body.men .card-title, body.men .card-sub { color:#e5e7eb; }
body.men .card-sub { color:#94a3b8; }

.scene-bg { background: var(--scene); }
.hero-img { background: var(--hero-overlay), var(--hero-img); background-size: cover; background-position: center; }
.soft-shadow { box-shadow: 0 20px 45px -15px var(--shadow); }
.tile-shadow { box-shadow: 0 10px 25px -8px var(--shadow); }
.card { background: var(--card-bg); }
.title { color: var(--title); }
.subtitle { color: var(--subtitle); }
.primary-btn { background: var(--btn); }
.nav-bar { background: var(--nav); }
.icon-badge { background: linear-gradient(135deg,var(--accentA),var(--accentB)); }
.t1{background:linear-gradient(135deg,var(--t1a),var(--t1b));}
.t2{background:linear-gradient(135deg,var(--t2a),var(--t2b));}
.t3{background:linear-gradient(135deg,var(--t3a),var(--t3b));}
.t4{background:linear-gradient(135deg,var(--t4a),var(--t4b));}
.t5{background:linear-gradient(135deg,var(--t5a),var(--t5b));}
.t6{background:linear-gradient(135deg,var(--t6a),var(--t6b));}
::-webkit-scrollbar { width: 0; }
</style>
</head>
<body class="scene-bg min-h-screen py-8 px-4">

<!-- THEME TOGGLE -->
<div class="max-w-md mx-auto mb-5 flex justify-center">
<div class="bg-white/70 rounded-full p-1 flex tile-shadow text-sm font-semibold">
<button id="btnHer" onclick="setTheme('her')" class="px-5 py-2 rounded-full bg-gradient-to-r from-fuchsia-500 to-pink-500 text-white">For Her</button>
<button id="btnHim" onclick="setTheme('him')" class="px-5 py-2 rounded-full text-slate-600">For Him</button>
</div>
</div>

<!-- APP FRAME -->
<div class="max-w-md mx-auto bg-white/25 backdrop-blur-xl rounded-[42px] p-3 soft-shadow border border-white/30">
<div class="rounded-[34px] overflow-hidden card relative">

<!-- HERO -->
<div class="hero-img relative px-6 pt-6 pb-28">
<div class="flex justify-between items-center">
<button class="w-11 h-11 rounded-full bg-white/85 text-slate-700 flex items-center justify-center tile-shadow"><i class="fa-solid fa-arrow-left"></i></button>
<button class="w-11 h-11 rounded-full bg-white/85 text-pink-500 flex items-center justify-center tile-shadow"><i class="fa-solid fa-heart"></i></button>
</div>
<div class="mt-10">
<h1 class="serif text-5xl font-extrabold title tracking-wide drop-shadow">PATTAYA</h1>
<p class="subtitle font-medium mt-2 leading-snug">Sun, sea and<br>unforgettable vibes.</p>
</div>
</div>

<!-- DISCOVER CARD -->
<div class="px-5 -mt-20 relative z-10">
<div class="card rounded-[28px] p-5 tile-shadow flex items-start gap-4">
<div class="w-12 h-12 shrink-0 rounded-2xl icon-badge text-white flex items-center justify-center text-lg tile-shadow">
<i class="fa-solid fa-umbrella-beach"></i>
</div>
<div class="flex-1">
<div class="flex justify-between items-start">
<h2 class="serif text-xl font-bold card-title title leading-tight">Discover<br>Pattaya</h2>
<i class="fa-solid fa-ellipsis-vertical text-slate-300 mt-1"></i>
</div>
<p class="text-xs card-sub text-gray-500 mt-2">Beaches, nightlife and adventures await.</p>
</div>
<button class="self-end w-11 h-11 rounded-full primary-btn text-white flex items-center justify-center tile-shadow">
<i class="fa-solid fa-arrow-right"></i>
</button>
</div>
</div>

<!-- EXPERIENCE -->
<div class="px-6 pt-7 pb-3">
<h3 class="serif text-lg font-bold title text-center mb-4">Your Pattaya Experience</h3>
<div class="grid grid-cols-3 gap-3">
<div class="rounded-2xl t1 p-4 text-center text-white tile-shadow"><i class="fa-solid fa-umbrella-beach text-2xl"></i><p class="text-[11px] font-semibold mt-2">Beaches</p></div>
<div class="rounded-2xl t2 p-4 text-center text-white tile-shadow"><i class="fa-solid fa-martini-glass-citrus text-2xl"></i><p class="text-[11px] font-semibold mt-2">Nightlife</p></div>
<div class="rounded-2xl t3 p-4 text-center text-white tile-shadow"><i class="fa-solid fa-ship text-2xl"></i><p class="text-[11px] font-semibold mt-2">Island Tours</p></div>
</div>
<div class="grid grid-cols-3 gap-3 mt-3">
<div class="rounded-2xl t4 p-4 text-center text-white tile-shadow"><i class="fa-solid fa-spa text-2xl"></i><p class="text-[11px] font-semibold mt-2">Spa</p></div>
<div class="rounded-2xl t5 p-4 text-center text-white tile-shadow"><i class="fa-solid fa-utensils text-2xl"></i><p class="text-[11px] font-semibold mt-2">Dining</p></div>
<div class="rounded-2xl t6 p-4 text-center text-white tile-shadow"><i class="fa-solid fa-hotel text-2xl"></i><p class="text-[11px] font-semibold mt-2">Hotels</p></div>
</div>
<div class="flex items-center gap-3 mt-6">
<button class="flex-1 primary-btn text-white font-semibold py-4 rounded-2xl tile-shadow flex items-center justify-center gap-2"><i class="fa-solid fa-wand-magic-sparkles"></i> Start Exploring</button>
<button class="w-14 h-14 rounded-full bg-white text-slate-500 flex items-center justify-center tile-shadow"><i class="fa-solid fa-ellipsis"></i></button>
</div>
</div>

<!-- BOTTOM NAV -->
<div class="px-6 pb-6 pt-2">
<div class="nav-bar rounded-3xl px-7 py-4 flex justify-between items-center text-white/70 tile-shadow">
<button class="text-white"><i class="fa-solid fa-house text-lg"></i></button>
<button class="hover:text-white"><i class="fa-solid fa-location-dot text-lg"></i></button>
<button class="hover:text-white"><i class="fa-solid fa-heart text-lg"></i></button>
<button class="hover:text-white"><i class="fa-solid fa-user text-lg"></i></button>
</div>
</div>

</div>
</div>

<p class="max-w-md mx-auto text-center text-white/85 text-xs mt-6">
Toggle <strong>For Her</strong> (purple/pink) and <strong>For Him</strong> (dark steel/teal) to compare. Colours and images are easy to tweak.
</p>

<script>
function setTheme(t){
  const her = document.getElementById('btnHer');
  const him = document.getElementById('btnHim');
  if(t==='him'){
    document.body.classList.add('men');
    him.className = 'px-5 py-2 rounded-full bg-gradient-to-r from-cyan-600 to-sky-700 text-white';
    her.className = 'px-5 py-2 rounded-full text-slate-600';
  } else {
    document.body.classList.remove('men');
    her.className = 'px-5 py-2 rounded-full bg-gradient-to-r from-fuchsia-500 to-pink-500 text-white';
    him.className = 'px-5 py-2 rounded-full text-slate-600';
  }
}
</script>
</body>
</html>
